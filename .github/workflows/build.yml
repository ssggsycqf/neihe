name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ====== 诊断：打印项目根目录文件，方便排查 ======
      - name: Debug - List project files
        run: |
          echo "=== 项目根目录文件 ==="
          ls -la
          echo ""
          echo "=== gradle 目录内容 ==="
          ls -la gradle/wrapper/ 2>/dev/null || echo "⚠️ gradle/wrapper/ 目录不存在！"
          echo ""
          echo "=== gradlew 文件信息 ==="
          file gradlew 2>/dev/null || echo "⚠️ gradlew 文件不存在！"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          accept-android-sdk-licenses: true

      # ====== 核心修复：确保 gradlew 可用 ======
      - name: Ensure Gradle Wrapper exists and is executable
        run: |
          # 修复 Windows 换行符问题（CRLF → LF）
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            echo "✅ gradlew 已存在，已修复权限和换行符"
          else
            echo "⚠️ gradlew 不存在，正在通过已安装的 Gradle 生成 Wrapper..."
            # ubuntu-latest 预装了 Gradle，直接生成 wrapper
            gradle wrapper --gradle-version 8.11.1
            chmod +x gradlew
            echo "✅ Gradle Wrapper 已生成"
          fi

          # 验证 wrapper jar 是否存在
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "❌ gradle-wrapper.jar 仍然缺失！"
            echo "请检查仓库中是否提交了 gradle/wrapper/ 目录"
            exit 1
          fi
          echo "✅ Gradle Wrapper 验证通过"

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/**/*.apk
