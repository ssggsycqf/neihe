name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ① 检出代码（升级到 v5，解决 Node.js 20 弃用警告）
      - name: Checkout code
        uses: actions/checkout@v5

      # ② 设置 JDK 21（升级到 v5，解决 deprecation 警告）
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ③ 设置 Android SDK（参数名改为 packages，不是 install-packages）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          accept-android-sdk-licenses: true

      # ④ 授予 gradlew 执行权限（解决 exit code 126 的核心修复）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ⑤ 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # ⑥ 上传 APK 产物
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/**/*.apk
